<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Two-Panel Layout (Checkbox Sources)</title>
  <style>
    /* Basic reset + dark mode */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1E1E1E;
      color: #FFF;
      font-family: sans-serif;
      overflow: hidden; /* We'll manage scrolling in main content if needed */
    }

    /* Side panel */
    .sidebar {
      position: absolute;
      top: 0; 
      left: 0;
      width: 250px;       /* expanded width */
      height: 100%;
      background-color: #2A2A2A;
      box-sizing: border-box;
      transition: width 0.3s ease-in-out;
      overflow: hidden;   /* anything beyond boundary is hidden */
    }
    /* Collapsed: narrower width */
    .sidebar.collapsed {
      width: 60px;
    }

    /* Header in the side panel */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: flex-end; /* push button to the right */
      background-color: #333;
      padding: 10px;
    }

    /* The rest of the side panel content (hidden when collapsed) */
    .sidebar-content {
      padding: 10px;
    }
    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    /* Toggle button in the header */
    .toggle-btn {
      background: none;
      border: none;
      color: #FFD700;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
    }
    .toggle-btn:focus {
      outline: 1px solid #999;
    }

    /* Main content */
    .main-content {
      position: absolute;
      top: 0; 
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      transition: margin-left 0.3s ease-in-out;
      overflow-y: auto;
      background-color: #1E1E1E;
    }
    /* When sidebar is expanded, shift main content by 250px */
    .main-content.with-sidebar {
      margin-left: 250px;
    }
    /* When the sidebar is collapsed, shift by 60px */
    .sidebar.collapsed ~ .main-content.with-sidebar {
      margin-left: 60px;
    }

    /* Title styling: left-aligned with some padding */
    h1.main-title {
      margin: 0;
      padding: 20px 0 10px 20px; /* top, right, bottom, left */
      font-size: 1.5rem;
      font-weight: normal;
      color: #FFD700;
      text-align: left;
    }

    /* Simple styling for the source checkboxes */
    .checkbox-group label {
      display: block;
      margin-bottom: 5px;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 6px;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #555;
      background-color: #333;
      color: #FFF;
      cursor: pointer;
    }

    /* Placeholder in main content */
    .placeholder {
      margin-top: 100px;
      text-align: left;
      font-size: 1.2rem;
      color: #DDD;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <!-- Side Panel -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebarBtn" class="toggle-btn">&#9776;</button>
    </div>
    <div class="sidebar-content">
      <p>Select Source(s):</p>
      <div class="checkbox-group">
        <label><input type="checkbox" name="sources" value="vitalik.eth.limo"> vitalik.eth.limo</label>
        <label><input type="checkbox" name="sources" value="Reddit AMA"> Reddit AMA</label>
        <label><input type="checkbox" name="sources" value="Conversations"> Conversations</label>
        <label><input type="checkbox" name="sources" value="local://"> local:// (All local sources)</label>
      </div>
      <button id="fetchBtn">Fetch Analytics</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="main-content with-sidebar">
    <h1 class="main-title">Ecosystem Analytics</h1>
    <div class="placeholder">
      <p>Empty Main Panel</p>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('toggleSidebarBtn');

    toggleBtn.addEventListener('click', () => {
      // Toggle collapsed on the sidebar
      sidebar.classList.toggle('collapsed');
      // The margin shift is handled by the sibling selector in CSS
    });
  </script>
</body>
</html>
