<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Two-Panel Layout (Analytics with Tiling)</title>
  <style>
    /* Basic reset + dark mode */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1E1E1E;
      color: #FFF;
      font-family: sans-serif;
      overflow: hidden; /* We'll manage scrolling in main content if needed */
    }

    /* Side panel */
    .sidebar {
      position: absolute;
      top: 0; 
      left: 0;
      width: 250px;       /* expanded width */
      height: 100%;
      background-color: #2A2A2A;
      box-sizing: border-box;
      transition: width 0.3s ease-in-out;
      overflow: hidden;   /* hide overflow when collapsed */
    }
    .sidebar.collapsed {
      width: 60px;
    }

    /* Sidebar header */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: flex-end; /* push toggle button to the right */
      background-color: #333;
      padding: 10px;
    }

    /* Content in the side panel (hidden if collapsed) */
    .sidebar-content {
      padding: 10px;
    }
    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    /* Toggle button in the header */
    .toggle-btn {
      background: none;
      border: none;
      color: #FFD700;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
    }
    .toggle-btn:focus {
      outline: 1px solid #999;
    }

    /* Main content */
    .main-content {
      position: absolute;
      top: 0; 
      left: 0;
      height: 100%;
      box-sizing: border-box;
      transition: left 0.3s ease-in-out, width 0.3s ease-in-out;
      overflow-y: auto;
      background-color: #1E1E1E;
      padding: 20px;
    }
    .main-content.with-sidebar {
      left: 250px;
      width: calc(100% - 250px);
    }
    .sidebar.collapsed ~ .main-content.with-sidebar {
      left: 60px;
      width: calc(100% - 60px);
    }

    /* Title styling in the main panel */
    h1.main-title {
      margin: 0;
      padding: 20px 0 10px 20px;
      font-size: 1.5rem;
      font-weight: normal;
      color: #FFD700;
      text-align: left;
    }

    /* Divider for main panel */
    .divider {
      border: 0;
      border-top: 1px solid #444;
      margin: 0 20px 20px 20px;
    }

    /* Container for the tiled panels using a 2-col grid */
    #tilesContainer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 1rem;
      padding: 0 20px 20px 20px;
      box-sizing: border-box;
    }

    /* Each tile is a simple panel */
    .tile-panel {
      background-color: #2A2A2A;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
    }
    .tile-panel .panel-content {
      padding: 4px;
    }

    /* Titles for the checkbox lists in the side panel */
    .list-title {
      color: #FFD700;
      margin-bottom: 6px;
      font-weight: bold;
    }

    /* Basic styling for checkboxes and button */
    .checkbox-group label {
      display: block;
      margin-bottom: 5px;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 6px;
    }
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #555;
      background-color: #333;
      color: #FFF;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Side Panel -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebarBtn" class="toggle-btn">&#9776;</button>
    </div>
    <div class="sidebar-content">
      <div class="list-title">Select Source(s):</div>
      <div class="checkbox-group" id="sourcesList">
        <label><input type="checkbox" name="sources" value="vitalik.eth.limo"> vitalik.eth.limo</label>
        <label><input type="checkbox" name="sources" value="Reddit AMA"> Reddit AMA</label>
        <label><input type="checkbox" name="sources" value="Conversations"> Conversations</label>
        <label><input type="checkbox" name="sources" value="local://"> local:// (All local sources)</label>
      </div>

      <button id="fetchBtn">Fetch Analytics</button>

      <hr class="divider" />

      <div class="list-title" id="analyticsListTitle" style="display: none;">Available Analytics:</div>
      <div id="vizListContainer"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="main-content with-sidebar">
    <h1 class="main-title">Ecosystem Analytics</h1>
    <hr class="divider" />
    <div id="tilesContainer"></div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('toggleSidebarBtn');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    const fetchBtn = document.getElementById('fetchBtn');
    const vizListContainer = document.getElementById('vizListContainer');
    const analyticsListTitle = document.getElementById('analyticsListTitle');
    const tilesContainer = document.getElementById('tilesContainer');

    // On "Fetch Analytics"...
    fetchBtn.addEventListener('click', () => {
      // Gather selected sources
      const sourceCheckboxes = document.querySelectorAll('input[name="sources"]:checked');
      const selectedSources = Array.from(sourceCheckboxes).map(cb => cb.value);
      console.log("Selected sources:", selectedSources);

      // Dummy function returning some 'visualizations'
      const visualizations = getDummyVisualizations();
      if (visualizations.length > 0) {
        analyticsListTitle.style.display = "block"; // show heading
        vizListContainer.innerHTML = "";            // clear previous

        const checkboxGroup = document.createElement('div');
        checkboxGroup.classList.add('checkbox-group');

        visualizations.forEach(viz => {
          const label = document.createElement('label');
          label.innerHTML = `
            <input type="checkbox" name="vizCheckbox" value="${viz.file}" checked>
            ${viz.title} (${viz.description})
          `;
          checkboxGroup.appendChild(label);

          // Initially load the panel
          loadPanel(viz.file);

          // Listen for checkbox changes
          const checkbox = label.querySelector('input[type="checkbox"]');
          checkbox.addEventListener('change', e => {
            if (e.target.checked) {
              loadPanel(viz.file);
            } else {
              removePanel(viz.file);
            }
          });
        });

        vizListContainer.appendChild(checkboxGroup);
      } else {
        analyticsListTitle.style.display = "none";
        vizListContainer.innerHTML = "<p style='color: #CCC;'>No visualizations found.</p>";
      }
    });

    /**
     * Dummy function returning an array of objects describing
     * the analytics panels we want to load.
     * 'file' is the relative path to the HTML snippet (in templates/analytics/).
     */
    function getDummyVisualizations() {
      return [
        { title: "Docs Timeline", description: "Documents over time", file: "analytics/panel_one.html" },
        { title: "Tags Pie Chart", description: "Distribution of tags", file: "analytics/panel_two.html" },
        { title: "Authors Bar", description: "Most active authors", file: "analytics/panel_three.html" },
        { title: "Misc Chart", description: "Placeholder visualization", file: "analytics/panel_four.html" }
      ];
    }

    /**
     * Load a panel from the given file path,
     * create a .tile-panel for it, and insert it into #tilesContainer.
     */
    function loadPanel(panelFile) {
      // If it's already loaded, skip it.
      if (document.getElementById('tile-' + panelFile)) return;

      const tile = document.createElement('div');
      tile.classList.add('tile-panel');
      tile.id = 'tile-' + panelFile;

      // Fetch the panel snippet.
      fetch(panelFile)
        .then(resp => resp.text())
        .then(htmlSnippet => {
          tile.innerHTML = htmlSnippet;
        })
        .catch(err => {
          tile.innerHTML = `<div class="panel-content"><strong>Error loading ${panelFile}:</strong> ${err}</div>`;
        });

      tilesContainer.appendChild(tile);
    }

    /**
     * Remove the tile for the given panel file.
     */
    function removePanel(panelFile) {
      const tile = document.getElementById('tile-' + panelFile);
      if (tile) tile.remove();
    }
  </script>
</body>
</html>
