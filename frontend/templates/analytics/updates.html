<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }} 🚀</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1E1E1E;
      color: #FFF;
      margin: 0;
      padding: 20px;
    }
    .post {
      background-color: #2A2A2A;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 15px;
      margin: 20px auto;
      max-width: 800px;
    }
    .post h2 {
      color: #FFD700;
      margin-top: 0;
    }
    .vibe {
      font-size: 1.5em;
      margin-bottom: 10px;
    }
    .post p {
      line-height: 1.5;
    }
    .post .takeaways {
      margin-top: 10px;
      padding-left: 20px;
      list-style: disc;
      color: #ccc;
    }
    .post .relevance {
      font-style: italic;
      margin-top: 10px;
      color: #aaa;
    }
    .doc-link {
      margin-top: 15px;
      text-align: center;
    }
    .doc-link a {
      display: inline-block;
      background-color: #444;
      color: #FFD700;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    .doc-link a:hover {
      background-color: #555;
    }
    .copy-link {
      text-align: center;
      margin-top: 10px;
    }
    .copy-btn {
      background-color: #444;
      color: #FFD700;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .copy-btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>{{ title }} 🚀</h1>
  {% if selected_sources %}
    <p><strong>Selected Sources:</strong> {{ selected_sources | join(', ') }}</p>
  {% else %}
    <p><strong>Selected Sources:</strong> All</p>
  {% endif %}
  
  {% if data.posts %}
    {% for post in data.posts %}
      <div class="post">
        <pre style="white-space: pre-wrap;">{{ post.discord_post }}</pre>
        <div class="copy-link">
          <button class="copy-btn">📋 Copy Update</button>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <p>No updates available.</p>
  {% endif %}
  
  <script>
    // Function to generate Discord-ready Markdown from post data attributes.
    function generateMarkdown(postEl) {
        var title = postEl.getAttribute('data-post-title');
        var vibe = postEl.getAttribute('data-vibe');
        var description = postEl.getAttribute('data-description');
        var takeawaysRaw = postEl.getAttribute('data-takeaways');
        var originalTitle = postEl.getAttribute('data-original-title');
        var pdfLink = postEl.getAttribute('data-pdf-link');
        
        // Split takeaways using "||" as the delimiter.
        var takeaways = takeawaysRaw ? takeawaysRaw.split('||') : [];
        
        var md = "";
        md += "**" + title + "**\n";
        md += "_Vibe Check: " + vibe + "_\n\n";
        md += description + "\n\n";
        md += "**Key Takeaways:**\n";
        if (takeaways.length > 0 && takeaways[0].trim() !== "") {
            takeaways.forEach(function(item) {
            md += "- " + item + "\n";
            });
        } else {
            md += "No key takeaways available.\n";
        }
        md += "\n";
        if (pdfLink && pdfLink.trim() !== "") {
            md += "🔗 View Full Document: " + originalTitle + "\n";
            md += pdfLink + "\n";
        }
        return md;
    }
    
    // Attach click event listeners to each "Copy Update" button.
    document.querySelectorAll('.copy-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var preEl = this.parentElement.previousElementSibling;
        var markdown = preEl.textContent;
        navigator.clipboard.writeText(markdown).then(function() {
          btn.textContent = "Copied!";
          setTimeout(function() {
            btn.textContent = "📋 Copy Update";
          }, 2000);
        }).catch(function(err) {
          console.error('Could not copy text: ', err);
        });
      });
    });
  </script>
</body>
</html>
