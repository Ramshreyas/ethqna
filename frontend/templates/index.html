<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Two-Panel Layout (Analytics with Tiling)</title>
  <style>
    /* Basic reset + dark mode */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #1E1E1E;
      color: #FFF;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Side panel */
    .sidebar {
      position: absolute;
      top: 0; 
      left: 0;
      width: 250px;
      height: 100%;
      background-color: #2A2A2A;
      box-sizing: border-box;
      transition: width 0.3s ease-in-out;
      overflow: hidden;
    }
    .sidebar.collapsed {
      width: 60px;
    }

    /* Sidebar header */
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background-color: #333;
      padding: 10px;
    }

    /* Content in the side panel (hidden if collapsed) */
    .sidebar-content {
      padding: 10px;
    }
    .sidebar.collapsed .sidebar-content {
      display: none;
    }

    /* Toggle button in the header */
    .toggle-btn {
      background: none;
      border: none;
      color: #FFD700;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 6px;
    }
    .toggle-btn:focus {
      outline: 1px solid #999;
    }

    /* Main content */
    .main-content {
      position: absolute;
      top: 0; 
      left: 0;
      height: 100%;
      box-sizing: border-box;
      transition: left 0.3s ease-in-out, width 0.3s ease-in-out;
      overflow-y: auto;
      background-color: #1E1E1E;
      padding: 20px;
    }
    .main-content.with-sidebar {
      left: 250px;
      width: calc(100% - 250px);
    }
    .sidebar.collapsed ~ .main-content.with-sidebar {
      left: 60px;
      width: calc(100% - 60px);
    }

    /* Title styling in the main panel */
    h1.main-title {
      margin: 0;
      padding: 20px 0 10px 20px;
      font-size: 1.5rem;
      font-weight: normal;
      color: #FFD700;
      text-align: left;
    }

    /* Divider for main panel */
    .divider {
      border: 0;
      border-top: 1px solid #444;
      margin: 0 20px 20px 20px;
    }

    /* Container for the tiled panels using a 2-col grid */
    #tilesContainer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 1rem;
      padding: 0 20px 20px 20px;
      box-sizing: border-box;
    }

    /* Each tile is a simple panel */
    .tile-panel {
      background-color: #2A2A2A;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      aspect-ratio: 1 / 0.5;
    }
    .tile-panel .panel-content {
      padding: 4px;
    }

    /* Titles for the checkbox lists in the side panel */
    .list-title {
      color: #FFD700;
      margin-bottom: 6px;
      font-weight: bold;
    }

    /* Basic styling for checkboxes and button */
    .checkbox-group label {
      display: block;
      margin-bottom: 5px;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 6px;
    }
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #555;
      background-color: #333;
      color: #FFF;
      cursor: pointer;
    }

    /* Modal overlay */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }

    /* Modal content box */
    .modal-content {
      position: relative;
      margin: 5% auto;
      width: 90%;
      height: 80%;
      background-color: #1E1E1E;
      border-radius: 4px;
      padding: 10px;
    }

    /* Close button (top right of modal) */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      color: #FFF;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Fullscreen icon for each panel */
    .panel-container {
      position: relative;
      padding: none;
      margin: 0;
      border: none;
    }

    .fullscreen-btn {
      position: absolute;
      right: auto;
      top: 5px;
      right: 5px;
      background: none;
      border: none;
      color: #FFD700;
      font-size: 18px;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 3px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Side Panel -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebarBtn" class="toggle-btn">&#9776;</button>
    </div>
    <div class="sidebar-content">
      <!-- The sources list will be populated on page load -->
      <div class="list-title" id="sourcesListTitle" style="display: none;">Select Source(s):</div>
      <div class="checkbox-group" id="sourcesList"></div>

      <div id="dateRangePicker" style="margin-top: 10px;">
        <label for="startDate" style="display: block; color: #FFD700;">Start Date:</label>
        <input type="date" id="startDate">
        <label for="endDate" style="display: block; color: #FFD700; margin-top: 5px;">End Date:</label>
        <input type="date" id="endDate">
      </div>      

      <button id="fetchBtn">Fetch Analytics</button>

      <hr class="divider" />

      <div class="list-title" id="analyticsListTitle" style="display: none;">Available Analytics:</div>
      <div id="vizListContainer"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="mainContent" class="main-content with-sidebar">
    <h1 class="main-title">Ecosystem Analytics</h1>
    <hr class="divider" />
    <div id="tilesContainer"></div>
  </div>

  <!-- Fullscreen Modal -->
  <div id="fullscreenModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="modalCloseBtn">&times;</span>
      <iframe id="modalIframe" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
  </div>

  <script>
    // Debug helper: log messages with a prefix.
    function debug(msg) {
      console.log("[DEBUG]", msg);
    }

    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('toggleSidebarBtn');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      debug("Toggled sidebar collapsed state");
    });

    const fetchBtn = document.getElementById('fetchBtn');
    const sourcesList = document.getElementById('sourcesList');
    const sourcesListTitle = document.getElementById('sourcesListTitle');
    const vizListContainer = document.getElementById('vizListContainer');
    const analyticsListTitle = document.getElementById('analyticsListTitle');
    const tilesContainer = document.getElementById('tilesContainer');

    // Load available sources on page load.
    function loadSources() {
      fetch("/fetch_analytics", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}) // No sources specified; expecting only available_sources.
      })
      .then(resp => resp.json())
      .then(data => {
        const availableSources = data.available_sources || [];
        if (availableSources.length > 0) {
          sourcesListTitle.style.display = "block";
          sourcesList.innerHTML = "";
          const checkboxGroup = document.createElement('div');
          checkboxGroup.classList.add('checkbox-group');
          availableSources.forEach(src => {
            const label = document.createElement('label');
            label.innerHTML = `<input type="checkbox" name="sources" value="${src}"> ${src}`;
            checkboxGroup.appendChild(label);
          });
          sourcesList.appendChild(checkboxGroup);
          debug("Loaded sources: " + JSON.stringify(availableSources));
        }
      })
      .catch(error => {
        console.error("Error loading sources: ", error);
      });
    }

    // Fetch analytics based on selected sources.
    function fetchAnalytics() {
      const sourceCheckboxes = document.querySelectorAll('input[name="sources"]:checked');
      const selectedSources = Array.from(sourceCheckboxes).map(cb => cb.value);
      debug("Fetching analytics with selected sources: " + JSON.stringify(selectedSources));

      // Clear previously loaded panels.
      tilesContainer.innerHTML = "";

      // If no sources are selected, display a message and do not proceed.
      if (selectedSources.length === 0) {
        analyticsListTitle.style.display = "block";
        vizListContainer.innerHTML = "<p style='color: #CCC;'>No sources selected.</p>";
        return;
      }

      // Otherwise, fetch analytics from the backend.
      fetch("/fetch_analytics", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sources: selectedSources })
      })
      .then(resp => resp.json())
      .then(data => {
        const visualizations = data.visualizations || [];
        if (visualizations.length > 0) {
          analyticsListTitle.style.display = "block";
          vizListContainer.innerHTML = "";
          const vizCheckboxGroup = document.createElement('div');
          vizCheckboxGroup.classList.add('checkbox-group');
          visualizations.forEach(viz => {
            const panelPath = viz.path;
            const title = viz.title;
            const label = document.createElement('label');
            label.innerHTML = `<input type="checkbox" name="vizCheckbox" value="${panelPath}" checked> ${title}`;
            vizCheckboxGroup.appendChild(label);

            // Load the panel initially.
            loadPanel(panelPath);

            // Listen for checkbox changes.
            const checkbox = label.querySelector('input[type="checkbox"]');
            checkbox.addEventListener('change', e => {
              if (e.target.checked) {
                debug("Loading panel: " + panelPath);
                loadPanel(panelPath);
              } else {
                debug("Removing panel: " + panelPath);
                removePanel(panelPath);
              }
            });
          });
          vizListContainer.appendChild(vizCheckboxGroup);
        } else {
          analyticsListTitle.style.display = "none";
          vizListContainer.innerHTML = "<p style='color: #CCC;'>No visualizations found.</p>";
        }
      })
      .catch(error => {
        analyticsListTitle.style.display = "none";
        vizListContainer.innerHTML = `<p style='color: #CCC;'>Error: ${error}</p>`;
        debug("Error fetching analytics: " + error);
        console.error("Error fetching analytics:", error);
      });
    }

    // Open and close the fullscreen modal.
    function openFullscreenModal(src) {
      const modal = document.getElementById("fullscreenModal");
      const modalIframe = document.getElementById("modalIframe");
      modalIframe.src = src;
      modal.style.display = "block";
    }

    function closeFullscreenModal() {
      const modal = document.getElementById("fullscreenModal");
      modal.style.display = "none";
      document.getElementById("modalIframe").src = ""; // optional: clear source
    }

    // Add event listener to the close button.
    document.getElementById("modalCloseBtn").addEventListener("click", closeFullscreenModal);

    // Optionally, close modal when clicking outside the modal-content.
    window.addEventListener("click", function(event) {
      const modal = document.getElementById("fullscreenModal");
      if (event.target == modal) {
        closeFullscreenModal();
      }
    });

    // Helper functions to load and remove panels.
    function loadPanel(panelPath) {
      // Get selected sources.
      const sourceCheckboxes = document.querySelectorAll('input[name="sources"]:checked');
      const selectedSources = Array.from(sourceCheckboxes).map(cb => encodeURIComponent(cb.value));

      // Get the date range values.
      const startDateVal = document.getElementById("startDate").value;
      const endDateVal = document.getElementById("endDate").value;
      
      // Build query parameters.
      let queryParams = [];
      if (selectedSources.length) {
        queryParams.push(selectedSources.map(s => 'sources=' + s).join('&'));
      }
      if (startDateVal) {
        queryParams.push('start_date=' + encodeURIComponent(startDateVal));
      }
      if (endDateVal) {
        queryParams.push('end_date=' + encodeURIComponent(endDateVal));
      }
      const query = queryParams.length ? '?' + queryParams.join('&') : '';
      
      const fullPath = panelPath + query;
      
      // Prevent duplicate panels.
      if (document.getElementById('tile-' + panelPath)) return;
      debug("Loading panel in iframe from: " + fullPath);
      
      // Create a container for the panel.
      const container = document.createElement('div');
      container.classList.add('panel-container', 'tile-panel');
      container.id = 'tile-' + panelPath;
      
      // Create the fullscreen button.
      const fullscreenBtn = document.createElement('button');
      fullscreenBtn.classList.add('fullscreen-btn');
      fullscreenBtn.title = "Fullscreen";
      fullscreenBtn.innerHTML = "&#x26F6;";
      fullscreenBtn.addEventListener('click', () => {
        openFullscreenModal(fullPath);
      });
      container.appendChild(fullscreenBtn);
      
      // Create the iframe.
      const iframe = document.createElement('iframe');
      iframe.src = fullPath;
      iframe.style.width = "100%";
      iframe.style.height = "400px"; // adjust as needed
      iframe.style.border = "none";
      container.appendChild(iframe);
      
      // Append container to the tiles container.
      tilesContainer.appendChild(container);
    }

    // Set up event listeners.
    fetchBtn.addEventListener('click', fetchAnalytics);
    document.addEventListener('DOMContentLoaded', loadSources);
  </script>
</body>
</html>
